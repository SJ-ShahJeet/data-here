<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data-here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --hall:#E9ECF1; --paper:#FFFFFF; --ink:#1A1F2C; --ink2:#4A5266; --ink3:#8A91A3; --rule:#D5DAE3;
    --cobalt:#2340E0; --marker:#FFE14D; --strike:#D93A3A;
    --fit:#2340E0; --intent:#0E9F6E; --lookalike:#8B5CF6; --warmth:#F06A1D;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--hall); color:var(--ink); font:400 17px/1.5 "Archivo", system-ui, sans-serif; }
  :focus-visible { outline:3px solid var(--cobalt); outline-offset:2px; }
  button, input { font:inherit; color:inherit; }
  img { display:block; }

  /* chrome */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:28px; padding:14px 32px; background:var(--hall); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; font-stretch:112%; letter-spacing:-.3px; white-space:nowrap; }
  .steps { display:flex; gap:4px; list-style:none; margin:0; padding:0; overflow-x:auto; flex:1; }
  .steps button { border:0; background:none; padding:8px 12px; border-radius:8px; color:var(--ink3); cursor:pointer; white-space:nowrap; font-size:15px; transition:color .15s ease, background-color .15s ease; }
  .steps button b { font-weight:700; margin-right:6px; }
  .steps button[aria-current] { color:var(--ink); background:var(--paper); box-shadow:inset 0 -2px 0 var(--cobalt); }
  .btn { border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:10px; padding:11px 20px; font-weight:700; cursor:pointer; transition:transform .16s var(--ease-out), border-color .15s ease; }
  .btn:active:not(:disabled), .badge:active { transform:scale(.97); }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--rule); }
  main { max-width:1240px; margin:0 auto; padding:40px 32px 120px; }
  .pager { position:fixed; right:24px; bottom:20px; display:flex; gap:8px; z-index:5; }
  .pager .btn.ghost { background:var(--hall); }

  h1 { font-size:clamp(36px, 5vw, 60px); line-height:1.02; font-weight:800; font-stretch:115%; letter-spacing:-1.5px; margin:0 0 18px; max-width:16ch; text-wrap:balance; }
  h2 { font-size:clamp(28px, 3.4vw, 40px); line-height:1.06; font-weight:800; font-stretch:112%; letter-spacing:-1px; margin:0 0 10px; max-width:26ch; text-wrap:balance; }
  .lede { font-size:20px; color:var(--ink2); max-width:56ch; margin:0 0 24px; text-wrap:pretty; }
  .split h1 { font-size:clamp(34px, 3.6vw, 46px); letter-spacing:-1px; }
  .split { display:grid; grid-template-columns:minmax(300px, 400px) 1fr; gap:48px; align-items:start; }
  .sticky { position:sticky; top:96px; }

  /* logos: favicon over an initial, so a missing icon still reads */
  .logo { position:relative; display:inline-grid; place-items:center; flex:none; width:var(--s, 20px); height:var(--s, 20px); border-radius:5px; background:var(--hall); color:var(--ink2); font-weight:800; font-size:calc(var(--s, 20px) * .5); overflow:hidden; vertical-align:middle; }
  .logo::before { content:attr(data-i); }
  .logo img { position:absolute; inset:0; width:100%; height:100%; background:var(--paper); }

  /* the room: a marked-up attendee sheet (the one orchestrated moment: strike, then mark) */
  .sheet { background:var(--paper); border-radius:4px; padding:28px 32px 32px; box-shadow:0 1px 0 var(--rule), 0 18px 40px -24px rgba(26,31,44,.35); }
  .sheet-head { display:flex; justify-content:space-between; gap:16px; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:16px; font-weight:700; }
  .sheet-head span { color:var(--ink3); font-weight:400; }
  .names { font-size:14.5px; line-height:2.05; color:var(--ink2); }
  .co { position:relative; white-space:nowrap; margin-right:14px; }
  .co.out { color:var(--ink3); }
  .co.out::after { content:""; position:absolute; left:-2px; right:-2px; top:52%; height:1.5px; background:var(--strike); transform-origin:left; animation:strike .3s var(--ease-out) both; animation-delay:calc(var(--k) * 3ms + 150ms); }
  .co.pick { color:var(--ink); font-weight:700; padding:0 3px; background:linear-gradient(var(--marker), var(--marker)) left 55% / 0 72% no-repeat; animation:mark .45s var(--ease-out) forwards; animation-delay:calc(1.1s + var(--p) * 60ms); }
  @keyframes strike { from { transform:scaleX(0); } }
  @keyframes mark { to { background-size:100% 72%; } }
  .key { display:grid; gap:12px; margin:26px 0 0; padding:0; list-style:none; }
  .key li { display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:baseline; }
  .key b { font-size:32px; font-weight:800; font-stretch:115%; line-height:1; font-variant-numeric:tabular-nums; }
  .key .m { background:var(--marker); padding:0 4px; justify-self:start; }
  .key .s { text-decoration:line-through; text-decoration-color:var(--strike); text-decoration-thickness:2px; }

  /* your pitch */
  .read { background:var(--paper); border-radius:4px; padding:8px 28px; }
  .read dl { margin:0; }
  .read div { display:grid; grid-template-columns:150px 1fr; gap:20px; padding:18px 0; border-bottom:1px solid var(--rule); }
  .read div:last-child { border-bottom:0; }
  .read dt { color:var(--ink3); }
  .read dd { margin:0; display:flex; flex-wrap:wrap; gap:6px 18px; font-weight:600; }
  .site { display:flex; align-items:center; gap:12px; font-weight:700; font-size:18px; margin-bottom:14px; }

  /* badges */
  .board { display:grid; grid-template-columns:1fr 380px; gap:28px; align-items:start; }
  .badges { display:grid; grid-template-columns:repeat(auto-fill, minmax(196px, 1fr)); gap:18px; }
  .badge { position:relative; text-align:left; background:var(--paper); border:0; border-radius:10px; padding:0 0 14px; cursor:pointer; box-shadow:0 1px 0 var(--rule), 0 10px 24px -18px rgba(26,31,44,.5); display:flex; flex-direction:column; transition:transform .16s var(--ease-out), box-shadow .2s ease; }
  .badge[aria-pressed=true] { box-shadow:0 0 0 3px var(--cobalt), 0 10px 24px -18px rgba(26,31,44,.5); }
  .badge .band { height:34px; border-radius:10px 10px 0 0; background:var(--cobalt); display:flex; align-items:center; justify-content:space-between; padding:0 12px; color:#fff; font-size:12px; font-weight:600; }
  .badge .slot { width:34px; height:7px; border-radius:4px; background:var(--hall); }
  .badge .who { padding:14px 14px 0; flex:1; display:block; }
  .badge .first { display:block; font-size:26px; line-height:1; font-weight:800; font-stretch:118%; letter-spacing:-.5px; }
  .badge .title { color:var(--ink2); font-size:14px; margin:6px 0 10px; min-height:2.9em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .badge .org { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .badge .org span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge .foot { display:flex; align-items:center; gap:10px; padding:12px 14px 0; font-variant-numeric:tabular-nums; }
  .badge .rank { font-weight:800; font-stretch:115%; font-size:15px; }
  .meter { display:flex; flex:1; height:6px; border-radius:3px; overflow:hidden; background:var(--hall); }
  .meter i { display:block; height:100%; }
  .warmtag { position:absolute; top:44px; right:12px; background:var(--warmth); color:#fff; font-size:12px; font-weight:700; border-radius:20px; padding:2px 9px; }
  @media (hover: hover) and (pointer: fine) {
    .badge:hover { transform:translateY(-2px); }
    .steps button:hover { color:var(--ink); }
    .btn.ghost:hover { border-color:var(--ink); }
  }

  /* why panel: content swaps with a short blur crossfade */
  .why { position:sticky; top:96px; background:var(--paper); border-radius:10px; padding:22px; max-height:calc(100vh - 120px); overflow:auto; box-shadow:0 1px 0 var(--rule); }
  .why > div { transition:opacity .18s ease, filter .18s ease; }
  .why > div.swap { opacity:0; filter:blur(3px); transition:none; }
  .why h3 { margin:0; font-size:26px; font-weight:800; font-stretch:115%; letter-spacing:-.5px; }
  .why .org { display:flex; align-items:center; gap:8px; color:var(--ink2); margin:4px 0 14px; }
  .why .meter { height:10px; margin-bottom:6px; }
  .why .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--ink2); margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .why .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  .why h4 { margin:18px 0 6px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .why h4 i { width:10px; height:10px; border-radius:2px; }
  .why ul { margin:0; padding:0 0 0 18px; color:var(--ink2); font-size:15px; }
  .why li { margin:4px 0; }
  .quote { margin:18px 0 0; padding:14px 16px; background:var(--hall); border-radius:8px; font-style:italic; color:var(--ink2); font-size:15px; }
  .quote b { display:block; font-style:normal; color:var(--ink); font-size:13px; margin-bottom:4px; }

  /* map */
  .map svg { width:100%; height:auto; display:block; background:var(--paper) radial-gradient(var(--rule) 1px, transparent 1.2px) 0 0 / 22px 22px; border-radius:10px; }
  .map line { stroke-width:1.5; opacity:.35; transition:opacity .2s ease; }
  .map .n { transition:opacity .2s ease; }
  .map .n.person { cursor:pointer; }
  .map text { fill:var(--ink2); font:500 12px "Archivo", sans-serif; pointer-events:none; paint-order:stroke; stroke:var(--paper); stroke-width:4px; }
  .map .person text.l, .map .you text.l { fill:var(--ink); font-weight:800; font-size:13px; }
  .map svg.focus line:not(.hot) { opacity:.05; } .map svg.focus line.hot { opacity:1; stroke-width:2.5; }
  .map svg.focus .n:not(.hot) { opacity:.15; }
  .mapkey { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:14px; color:var(--ink2); }
  .mapkey i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

  /* warm intros */
  .card-note { background:#FFF6C2; border-radius:3px; padding:22px 24px; font-size:22px; font-style:italic; font-stretch:95%; transform:rotate(-1.2deg); box-shadow:0 12px 24px -18px rgba(26,31,44,.5); margin:8px 0 28px; max-width:420px; }
  .card-note small { display:block; font-style:normal; font-size:13px; color:var(--ink2); margin-top:10px; }
  .chain { display:flex; align-items:center; flex-wrap:wrap; }
  .chain span { background:var(--paper); border-radius:20px; padding:6px 14px; font-weight:700; }
  .chain i { width:28px; height:2px; background:var(--warmth); }
  .ladder { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .ladder h4 { margin:0 0 10px; font-weight:700; color:var(--ink2); }
  .ladder ol { margin:0; padding:0; list-style:none; counter-reset:r; }
  .ladder li { counter-increment:r; display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  .ladder li::before { content:counter(r); font-weight:800; font-stretch:115%; width:20px; color:var(--ink3); }
  .ladder li.hit { background:#FFF1E8; }
  .ladder li.hit::before { color:var(--warmth); }
  .ladder li b { white-space:nowrap; }
  .ladder li small { color:var(--ink3); margin-left:auto; text-align:right; }

  /* outreach */
  .mail { background:var(--paper); border-radius:10px; max-width:820px; box-shadow:0 18px 40px -26px rgba(26,31,44,.5); overflow:hidden; }
  .mail .f { display:grid; grid-template-columns:80px 1fr; padding:12px 24px; border-bottom:1px solid var(--rule); }
  .mail .f span { color:var(--ink3); }
  .mail .body { padding:22px 24px; white-space:pre-wrap; line-height:1.6; max-width:72ch; }
  .mail .act { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:16px 24px; background:var(--hall); border-top:1px solid var(--rule); }
  .mail .act p { margin:0 0 0 auto; color:var(--ink2); font-size:14px; }
  .done { color:var(--intent); font-weight:700; }

  /* landing */
  .section { margin-top:96px; }
  .section > h2 { margin-bottom:28px; }
  .how { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; background:var(--paper); border-radius:10px; }
  .how > div { padding:26px 26px 30px; }
  .how > div + div { border-left:1px solid var(--rule); }
  .how .who { display:flex; align-items:center; gap:10px; color:var(--ink2); font-size:14px; margin-bottom:18px; }
  .how h3 { margin:0 0 8px; font-size:24px; font-weight:800; font-stretch:115%; letter-spacing:-.4px; }
  .how h3 span { color:var(--ink3); margin-right:8px; }
  .how p { margin:0; color:var(--ink2); max-width:40ch; }
  .sample { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; }
  .sample .sheet { max-height:300px; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent); }
  .funnel { list-style:none; margin:0 0 26px; padding:0; display:grid; gap:2px; }
  .funnel li { display:flex; align-items:baseline; gap:14px; padding:10px 0; border-bottom:1px solid var(--rule); color:var(--ink2); }
  .funnel b { font-size:30px; font-weight:800; font-stretch:115%; color:var(--ink); min-width:3.2ch; font-variant-numeric:tabular-nums; }
  footer { margin-top:96px; padding-top:20px; border-top:1px solid var(--rule); color:var(--ink3); font-size:14px; display:flex; flex-wrap:wrap; gap:8px 24px; }

  /* intake + progress */
  .intake { display:grid; grid-template-columns:1fr 360px; gap:56px; align-items:center; min-height:calc(100vh - 220px); }
  form { display:grid; gap:18px; max-width:560px; }
  label { display:grid; gap:6px; font-weight:700; }
  label small { font-weight:400; color:var(--ink3); }
  input[type=text], input[type=url] { background:var(--paper); border:1px solid var(--rule); border-radius:10px; padding:13px 14px; transition:border-color .15s ease, box-shadow .15s ease; }
  input[type=text]:focus, input[type=url]:focus { border-color:var(--cobalt); outline:none; box-shadow:0 0 0 3px rgba(35,64,224,.18); }
  .drop { position:relative; display:flex; align-items:baseline; gap:10px; background:var(--paper); border:1.5px dashed var(--rule); border-radius:10px; padding:13px 14px; cursor:pointer; font-weight:400; transition:border-color .15s ease; }
  .drop:hover, .drop:focus-within { border-color:var(--cobalt); }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop b { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .drop span { color:var(--ink3); }
  .either { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end; }
  .either > em { font-style:normal; color:var(--ink3); padding-bottom:14px; }
  .err { color:var(--strike); min-height:1.5em; margin:0; }
  .stack { display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:28px; color:var(--ink2); font-size:14px; }
  .stack span { display:flex; align-items:center; gap:8px; }
  .hero-badge { transform:rotate(3deg); width:300px; justify-self:center; pointer-events:none; }
  .hero-badge .badge { box-shadow:0 30px 60px -30px rgba(26,31,44,.55); }
  .lanyard { width:22px; height:120px; margin:0 auto -6px; background:repeating-linear-gradient(180deg, var(--cobalt) 0 14px, #3553F0 14px 28px); border-radius:2px; }
  .progress { list-style:none; padding:0; margin:28px 0; display:grid; gap:10px; max-width:600px; }
  .progress li { display:flex; align-items:center; gap:14px; background:var(--paper); border-radius:10px; padding:14px 16px; color:var(--ink3); transition:color .2s ease; }
  .progress .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--rule); flex:none; display:grid; place-items:center; font-size:13px; color:#fff; }
  .progress li.now, .progress li.done { color:var(--ink); }
  .progress li.now .tick { border-color:var(--cobalt); border-top-color:transparent; animation:spin .6s linear infinite; }
  .progress li.done .tick { background:var(--intent); border-color:var(--intent); }
  .progress .src { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink3); }
  @keyframes spin { to { transform:rotate(360deg); } }
  details { max-width:600px; color:var(--ink2); font-size:14px; }
  details pre { background:var(--paper); border-radius:8px; padding:12px; max-height:260px; overflow:auto; white-space:pre-wrap; font-size:12.5px; }


  /* scan replay: rail of checks, a stage where results land, a live feed */
  main.wide { max-width:none; padding:20px 24px 24px; }
  .scan { display:grid; grid-template-columns:290px 1fr 290px; gap:20px; height:calc(100vh - 110px); min-height:560px; }
  .rail { background:var(--paper); border-radius:12px; padding:24px 22px; display:flex; flex-direction:column; }
  .rail small { color:var(--ink3); font-size:13px; }
  .rail .title { display:block; font-size:22px; font-weight:800; font-stretch:112%; margin:2px 0 22px; }
  .checks { list-style:none; margin:0; padding:0; display:grid; gap:16px; }
  .checks li { display:grid; grid-template-columns:22px 1fr; gap:12px; color:var(--ink3); transition:color .2s ease; }
  .checks li .c { width:22px; height:22px; border-radius:50%; border:2px solid var(--rule); display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; }
  .checks li.now { color:var(--ink); } .checks li.now .c { border-color:var(--cobalt); border-right-color:transparent; animation:spin .6s linear infinite; }
  .checks li.done { color:var(--ink); } .checks li.done .c { background:var(--cobalt); border-color:var(--cobalt); animation:pop .25s var(--ease-out); }
  .checks li .sub { grid-column:2; font-size:13.5px; color:var(--ink2); margin-top:-8px; }
  @keyframes pop { from { transform:scale(.6); } }
  .rail-foot { margin-top:auto; background:var(--hall); border-radius:10px; padding:14px 16px; }
  .rail-foot .pbar { height:4px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:10px; }
  .rail-foot .pbar i { display:block; height:100%; width:0; background:var(--cobalt); transition:width .5s var(--ease-out); }
  .rail-foot b { display:block; } .rail-foot span { color:var(--ink2); font-size:14px; }
  .scan > * { min-height:0; }
  .stage { display:flex; flex-direction:column; min-width:0; }
  .rail { overflow:auto; }
  .checks li .sub { margin-top:-10px; }
  .pill { align-self:flex-start; background:var(--paper); border-radius:20px; padding:4px 12px; font-size:13px; font-weight:700; color:var(--cobalt); font-variant-numeric:tabular-nums; }
  .stage h2 { margin:10px 0 16px; min-height:1.1em; max-width:none; }
  .caret::after { content:""; display:inline-block; width:3px; height:.9em; background:var(--cobalt); margin-left:4px; vertical-align:-.08em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .panel { flex:1; background:var(--paper); border-radius:12px; padding:22px; overflow:hidden; position:relative; min-height:0; }
  .panel.scroll { overflow:auto; }
  .land { animation:land .32s var(--ease-out) both; }
  @keyframes land { from { opacity:0; transform:translateY(8px) scale(.98); } }
  .skel { border-radius:10px; background:var(--hall); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .counter { display:flex; align-items:baseline; gap:6px; margin-bottom:14px; font-variant-numeric:tabular-nums; }
  .counter b { font-size:34px; font-weight:800; font-stretch:115%; } .counter span { color:var(--ink3); }
  .counter em { font-style:normal; margin-left:auto; color:var(--ink2); font-size:14px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px; }
  .tag { border-radius:8px; padding:6px 12px; background:var(--hall); font-weight:600; }
  .tag.seg { background:var(--cobalt); color:#fff; }
  .panel h4 { margin:0 0 4px; color:var(--ink3); font-weight:600; font-size:14px; }
  .scan .names .co { opacity:.18; transition:opacity .2s ease, color .2s ease; }
  .scan .names .co.seen { opacity:1; }
  .scan .names .co.out:not(.seen)::after, .scan .names .co.pick:not(.seen) { animation:none; }
  .scan .names .co.out.seen::after { animation-delay:0s; }
  .scan .names .co.pick.seen { animation-delay:.1s; }
  .signals { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sig-h { display:flex; align-items:center; gap:10px; }
  .sig .meta { display:flex; align-items:center; gap:10px; }
  .sig { display:grid; gap:8px; border:1px solid var(--rule); border-radius:10px; padding:14px; min-height:96px; }
  .sig .t { justify-self:start; background:#E3F6EE; color:#0B7A55; font-weight:700; font-size:13px; border-radius:6px; padding:2px 8px; }
  .sig p { margin:0; color:var(--ink2); font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sig b { font-size:15px; }
  .scan .badges { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  .scan .badge .title { min-height:0; }
  .scan .map line { opacity:0; }
  .scan .map line.on { opacity:.45; transition:opacity .25s ease; }
  .scan .map .n { opacity:0; } .scan .map .n.on { opacity:1; transition:opacity .25s ease; }
  .feed { padding:8px 4px; overflow:auto; }
  .feed-h { display:flex; align-items:center; gap:8px; color:var(--ink2); font-weight:700; font-size:14px; margin-bottom:10px; }
  .feed-h i { width:8px; height:8px; border-radius:50%; background:var(--intent); box-shadow:0 0 0 4px #CDEFE2; }
  .feed ol { list-style:none; margin:0; padding:0; }
  .feed li { display:grid; grid-template-columns:18px 1fr auto; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule); font-size:14px; }
  .feed li i { width:14px; height:14px; margin-top:3px; border-radius:50%; background:var(--cobalt); }
  .feed li.f-sig i { background:var(--intent); } .feed li.f-warm i { background:var(--warmth); }
  .feed li time { color:var(--ink3); font-variant-numeric:tabular-nums; font-size:13px; }
  .endcard { display:flex; align-items:center; gap:14px; margin-top:16px; }
  @media (max-width: 1100px) { .scan { grid-template-columns:1fr; height:auto; } .feed { max-height:260px; } .scan .badges { grid-template-columns:repeat(2, 1fr); } .signals { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .co.out::after, .co.pick, .badge, .btn { animation:none; transition:none; }
    .co.pick { background-size:100% 72%; }
    .progress li.now .tick { animation-duration:2s; }
    .land, .checks li.done .c { animation:none; } .caret::after, .skel { animation:none; }
  }
  @media (max-width: 1000px) { .how, .sample { grid-template-columns:1fr; } .how > div + div { border-left:0; border-top:1px solid var(--rule); }
    .split, .board, .intake { grid-template-columns:1fr; } .sticky, .why { position:static; max-height:none; } .hero-badge { display:none; } }
  @media (max-width: 640px) { .top { padding:12px 16px; gap:12px; } .brand { font-size:0; gap:0; } main { padding:24px 16px 110px; }
    .either, .ladder, .read div { grid-template-columns:1fr; } .either > em { padding:0; } .sheet { padding:20px 16px; } .badges { grid-template-columns:1fr 1fr; } .pager { right:16px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><rect x="9" y="0" width="4" height="6" fill="#1A1F2C"/><rect x="1" y="4" width="20" height="21" rx="3" fill="#2340E0"/><rect x="7" y="7" width="8" height="2.5" rx="1.25" fill="#E9ECF1"/><rect x="5" y="14" width="12" height="2.5" rx="1" fill="#fff"/><rect x="5" y="19" width="8" height="2" rx="1" fill="#FFE14D"/></svg>data-here</div>
  <ol class="steps" id="steps"></ol>
  <button class="btn ghost" id="replay" hidden>Watch the replay</button><button class="btn" id="skip" hidden>Skip to results</button>
  <button class="btn ghost" id="restart" hidden>New run</button>
</header>
<main id="beat"></main>
<div class="pager" id="pager" hidden><button class="btn ghost" id="prev">Back</button><button class="btn" id="next">Next</button></div>
<script>
const FACTOR = { fit:'#2340E0', intent:'#0E9F6E', lookalike:'#8B5CF6', warmth:'#F06A1D' };
const FACTOR_HEAD = { fit:'Fits who you sell to', intent:'Talking about your problem', lookalike:'Looks like your customers', warmth:'You have a way in' };
const NODE = { you:'#2340E0', person:'#1A1F2C', company:'#6E7FA8', segment:'#8B5CF6', role:'#A3AAB9', topic:'#0E9F6E', contact:'#F06A1D' };
const NODE_NAME = { you:'You', person:'Prospect', company:'Company', segment:'Segment', role:'Buyer role', topic:'Buying signal', contact:'Your contact' };
const SPONSORS = [['brightdata.com', 'Bright Data', 'reads the web'], ['falkordb.com', 'FalkorDB', 'connects it'], ['truefoundry.com', 'TrueForge', 'runs the agent'], ['openai.com', 'OpenAI', 'reads and writes']];
const BAD_DOMAIN = /(^|\.)(apple|google|substack|medium|wordpress|blogspot|wix|linktr|facebook|linkedin|instagram)\./;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
let S, i = 0, picked = null, onPick = null;

const logo = (domain, name, size = 20) => `<span class="logo" style="--s:${size}px" data-i="${esc((name || '?').trim()[0].toUpperCase())}">${
  domain && !BAD_DOMAIN.test(domain) ? `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const totals = m => { const t = {}; m.reasons.forEach(r => t[r.factor] = (t[r.factor] || 0) + r.points); return t; };
const meter = (m, max) => `<span class="meter" aria-hidden="true">${Object.entries(totals(m)).map(([f, p]) => `<i style="width:${100 * p / max}%;background:${FACTOR[f]}"></i>`).join('')}</span>`;

const badge = (m, n, sel) => `<button class="badge" data-name="${esc(m.name)}" aria-pressed="${!!sel}" aria-label="${esc(m.name)}, rank ${n}">
  <span class="band"><span>${esc(S?.event || 'Your event')}</span><span class="slot"></span></span>
  ${m.warm_intro ? `<span class="warmtag">Intro via ${esc(m.warm_intro)}</span>` : ''}
  <span class="who"><span class="first">${esc(m.name)}</span><span class="title">${esc(m.title)}</span>
    <span class="org">${logo(m.domain, m.company)}<span>${esc(m.company)}</span></span></span>
  <span class="foot"><span class="rank">#${n}</span>${meter(m, 14)}<span>${m.score}</span></span></button>`;

function whyPanel(m, n) {
  const t = totals(m), groups = {};
  [...new Map(m.reasons.map(r => [r.text, r])).values()].forEach(r => (groups[r.factor] ||= []).push(r.text));
  return `<h3>${esc(m.name)}</h3><div class="org">${logo(m.domain, m.company, 22)}${esc(m.title)}, ${esc(m.company)}</div>
    ${meter(m, m.score)}
    <div class="legend">${Object.entries(t).map(([f, p]) => `<span><i style="background:${FACTOR[f]}"></i>${f} ${p}</span>`).join('')}<span style="margin-left:auto">rank ${n}, score ${m.score}</span></div>
    ${Object.entries(groups).map(([f, xs]) => `<h4><i style="background:${FACTOR[f]}"></i>${FACTOR_HEAD[f] || f}</h4><ul>${xs.map(x => `<li>${esc(x.length > 170 ? x.slice(0, 169) + '…' : x)}</li>`).join('')}</ul>`).join('')}
    ${m.hook ? `<p class="quote"><b>In their words</b>“${esc(m.hook.slice(0, 240))}${m.hook.length > 240 ? '…' : ''}”</p>` : ''}`;
}

// ---- graph: every reason is a FalkorDB path; all of them drawn on one map ----
function buildGraph(cards) {
  const nodes = new Map(), edges = new Map();
  const add = (kind, label, extra) => { const id = kind === 'you' ? 'you' : `${kind}:${label}`;
    if (!nodes.has(id)) nodes.set(id, { id, kind, label: kind === 'you' ? S.seller.name : label, owners: new Set(), ...extra });
    return nodes.get(id); };
  cards.forEach((m, r) => {
    add('person', m.name, { rank: r + 1, card: m });
    for (const re of m.reasons) {
      const p = re.path, q = [];  // collapse "-HAS_SIGNAL-> site -ABOUT->" into one SIGNAL hop
      for (let k = 0; k < p.length; k++) {
        if ((p[k] === 'site' || p[k] === 'post') && (p[k - 1] === 'HAS_SIGNAL' || p[k - 1] === 'POSTED')) { q.pop(); q.push('SIGNAL'); k++; continue; }
        q.push(p[k]);
      }
      let prev = null, prevKind = null;
      for (let k = 0; k < q.length; k += 2) {
        const rel = q[k - 1], label = q[k];
        const kind = k === 0 ? (label === 'Me' ? 'you' : q[1] === 'IS' ? 'company' : 'person')
          : { WORKS_AT:'company', HAS_ROLE:'role', SIGNAL:'topic', TARGETED_BY:'you', HAS_CUSTOMER:'you' }[rel]
            || (rel === 'IS' ? (prevKind === 'segment' ? 'company' : 'segment') : rel === 'KNOWS' ? (label === m.name ? 'person' : 'contact') : 'topic');
        const n = add(kind, label); n.owners.add(m.name);
        if (prev) { const key = [prev.id, n.id].sort().join('|');
          if (!edges.has(key)) edges.set(key, { a: prev, b: n, factor: re.factor, owners: new Set() });
          edges.get(key).owners.add(m.name); }
        prev = n; prevKind = kind;
      }
    }
  });
  return { nodes: [...nodes.values()], edges: [...edges.values()] };
}

function layout(g, W, H) {  // small deterministic force layout: repel all, pull along edges, gravity to centre
  g.nodes.forEach((n, k) => { const a = k * 2.39996, r = 30 + 26 * Math.sqrt(k); n.x = W / 2 + Math.cos(a) * r; n.y = H / 2 + Math.sin(a) * r; n.vx = n.vy = 0; });
  for (let t = 0; t < 420; t++) {
    const alpha = 1 - t / 420;
    for (let a = 0; a < g.nodes.length; a++) for (let b = a + 1; b < g.nodes.length; b++) {
      const A = g.nodes[a], B = g.nodes[b], dx = A.x - B.x, dy = A.y - B.y, d2 = Math.max(dx * dx + dy * dy, 80), f = 9000 / d2 / Math.sqrt(d2);
      A.vx += dx * f; A.vy += dy * f; B.vx -= dx * f; B.vy -= dy * f;
    }
    for (const e of g.edges) { const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.hypot(dx, dy) || 1, f = (d - 110) * 0.03 / d;
      e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f; }
    for (const n of g.nodes) {
      n.vx += (W / 2 - n.x) * 0.002; n.vy += (H / 2 - n.y) * 0.004;
      if (n.kind === 'you') { n.x = W / 2; n.y = H / 2; continue; }
      n.x = Math.min(W - 70, Math.max(70, n.x + n.vx * alpha)); n.y = Math.min(H - 24, Math.max(24, n.y + n.vy * alpha)); n.vx *= 0.5; n.vy *= 0.5;
    }
  }
}

function mountGraph(el, cards) {
  const W = 1000, H = 640, g = buildGraph(cards); layout(g, W, H);
  const r = n => n.kind === 'you' ? 18 : n.kind === 'person' ? 6 + n.card.score * 0.7 : n.kind === 'company' ? 8 : 5;
  const degree = n => g.edges.filter(e => e.a === n || e.b === n).length;
  const label = n => n.kind !== 'topic' && n.kind !== 'role' || degree(n) > 1;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of why each prospect ranked">
    ${g.edges.map((e, k) => `<line data-e="${k}" x1="${e.a.x}" y1="${e.a.y}" x2="${e.b.x}" y2="${e.b.y}" stroke="${FACTOR[e.factor] || '#A3AAB9'}"/>`).join('')}
    ${g.nodes.map((n, k) => `<g class="n ${n.kind}" data-n="${k}" transform="translate(${n.x},${n.y})"><title>${esc(n.label)}</title>
      <circle r="${r(n)}" fill="${n.kind === 'person' ? '#fff' : NODE[n.kind]}" ${n.kind === 'person' ? 'stroke="#1A1F2C" stroke-width="2.5"' : ''}/>
      ${n.kind === 'person' ? `<text text-anchor="middle" dy="4" style="fill:#1A1F2C;stroke:none;font-weight:800;font-size:11px">${n.rank}</text>` : ''}
      ${label(n) ? `<text class="l" text-anchor="middle" dy="${r(n) + 15}">${esc(n.label.length > 22 ? n.label.slice(0, 21) + '…' : n.label)}</text>` : ''}</g>`).join('')}
    </svg><div class="mapkey">${Object.entries(NODE).map(([k, c]) => `<span><i style="background:${c}"></i>${NODE_NAME[k]}</span>`).join('')}</div>`;
  const svg = el.querySelector('svg');
  svg.addEventListener('click', e => { const x = e.target.closest('.n.person'); if (x) pick(g.nodes[x.dataset.n].label); });
  return name => {
    svg.classList.add('focus');
    svg.querySelectorAll('line').forEach(l => l.classList.toggle('hot', g.edges[l.dataset.e].owners.has(name)));
    svg.querySelectorAll('.n').forEach(x => { const nd = g.nodes[x.dataset.n]; x.classList.toggle('hot', nd.owners.has(name) || nd.kind === 'you'); });
  };
}

// select a prospect: marks the badge, lights the graph paths, fills the why panel
function pick(name) {
  const m = S.top.find(c => c.name === name) || S.top[0];
  picked = m.name;
  document.querySelectorAll('.badge[data-name]').forEach(b => b.setAttribute('aria-pressed', b.dataset.name === m.name));
  const why = $('why');
  if (why) {
    why.innerHTML = `<div class="swap">${whyPanel(m, S.top.indexOf(m) + 1)}</div>`;
    requestAnimationFrame(() => why.firstChild.classList.remove('swap'));
  }
  onPick?.(m.name);
}

// ---- the story ----
const BEATS = [
  ['The room', () => {
    const k = S.room.kinds, ops = k.operator || 0, out = S.room.companies - ops, picks = new Set(S.top.map(m => m.company));
    let p = 0;
    return `<div class="split"><div class="sticky">
      <h1>${S.room.people} people at ${esc(S.event)}. Ten are worth your afternoon.</h1>
      <p class="lede">We read every company in the room, crossed off the ones that sell instead of buy, and marked the people most likely to say yes to ${esc(S.seller.name)}.</p>
      <ul class="key">
        <li><b>${S.room.companies}</b><span>companies on the list</span></li>
        <li><b class="s">${out}</b><span>crossed off: ${k.vendor || 0} vendors, plus investors, press and associations</span></li>
        <li><b>${ops}</b><span>are real buyers for what you sell</span></li>
        <li><b class="m">${S.top.length}</b><span>people on your shortlist, from ${picks.size} companies</span></li>
      </ul></div>
      <div class="sheet"><div class="sheet-head">${esc(S.event)}: companies attending <span>${S.room.companies}</span></div>
        <div class="names">${S.companies.map((c, n) => picks.has(c.name) ? `<span class="co pick" style="--p:${p++}">${esc(c.name)}</span> `
          : `<span class="co ${c.kind === 'operator' ? '' : 'out'}" style="--k:${n}">${esc(c.name)}</span> `).join('')}</div></div></div>`; }],
  ['Your pitch', () => { const icp = S.seller.icp, host = S.seller.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    const dd = xs => xs.map(x => `<span>${esc(x)}</span>`).join('');
    return `<div class="split"><div>
      <h2>Before reading the room, we read your site.</h2>
      <div class="site">${logo(host, S.seller.name, 28)}${esc(host)}</div>
      <p class="lede">${esc(S.seller.summary)}</p></div>
      <div class="read"><dl>
        <div><dt>Sells to</dt><dd>${dd(icp.segments)}</dd></div>
        <div><dt>Buyer titles</dt><dd>${dd(icp.buyer_roles)}</dd></div>
        <div><dt>Listens for</dt><dd>${dd(icp.pain_topics)}</dd></div>
        <div><dt>Finds twins of</dt><dd>${dd(S.seller.customers)}</dd></div>
      </dl></div></div>`; }],
  ['Shortlist', () => `<h2>Your shortlist, with the reasons attached.</h2>
    <p class="lede">Pick a badge to see why that person made it.</p>
    <div class="board"><div class="badges">${S.top.map((m, n) => badge(m, n + 1, m.name === picked)).join('')}</div><aside class="why" id="why" aria-live="polite"></aside></div>`],
  ['The map', () => `<h2>Every reason is a path in the graph.</h2>
    <p class="lede">Pick a person. The lit lines are the exact paths FalkorDB scored.</p>
    <div class="board"><div class="map" id="graph"></div><aside class="why" id="why" aria-live="polite"></aside></div>`],
  ['Warm intros', () => { const M = S.memory, before = S.top.slice(0, 5), after = M.top_after;
    const li = m => `<li class="${m.name === M.target ? 'hit' : ''}">${logo(m.domain, m.company, 18)}<b>${esc(m.name)}</b><small>${esc(m.company)}</small></li>`;
    const beforeList = before.some(m => m.name === M.target) ? before : [...before.slice(0, 4), S.top[M.rank_before - 1]];
    return `<div class="split"><div>
      <h2>One line about who you know moves ${esc(M.target)} from #${M.rank_before} to #${M.rank_after ?? '–'}.</h2>
      <div class="card-note">${esc(M.note)}<small>Typed to the agent. Saved in the graph as two links.</small></div>
      <div class="chain"><span>You</span><i></i><span>${esc(M.note.match(/^Met (\S+)/)?.[1] || 'Contact')}</span><i></i><span>${esc(M.target)}</span></div></div>
      <div class="ladder"><div><h4>Before the note</h4><ol>${beforeList.map(li).join('')}</ol></div><div><h4>After the note</h4><ol>${after.map(li).join('')}</ol></div></div></div>`; }],
  ['Outreach', () => `<h2>An opener built from what they said in public.</h2>
    <p class="lede">The agent drafts it. Nothing is sent until you approve.</p>
    <div class="mail"><div class="f"><span>To</span><b>${esc(S.email.to)}</b></div><div class="f"><span>Subject</span><b>${esc(S.email.subject)}</b></div>
      <div class="body">${esc(S.email.body)}</div>
      <div class="act" id="act"><button class="btn" id="approve">Approve and send</button><button class="btn ghost" id="deny">Don’t send</button><p>TrueForge holds send_email until you decide.</p></div></div>`],
];

function show(n) {
  if (!S) return;
  run++; $('beat').classList.remove('wide'); $('skip').hidden = true; $('replay').hidden = false; $('pager').hidden = false;
  i = Math.max(0, Math.min(BEATS.length - 1, n));
  $('beat').innerHTML = BEATS[i][1]();
  $('steps').innerHTML = BEATS.map(([t], k) => `<li><button ${k === i ? 'aria-current="step"' : ''} data-k="${k}"><b>${k + 1}</b>${t}</button></li>`).join('');
  $('prev').disabled = i === 0; $('next').disabled = i === BEATS.length - 1;
  onPick = $('graph') ? mountGraph($('graph'), S.top) : null;
  if ($('why')) pick(picked || S.top[0].name);
  if ($('approve')) {
    $('approve').onclick = () => $('act').innerHTML = `<span class="done">Approved and sent to ${esc(S.email.to)}.</span><p>In the live agent this is TrueForge’s approval step.</p>`;
    $('deny').onclick = () => $('act').innerHTML = `<span>Not sent. The draft stays with the agent for edits.</span>`;
  }
  window.scrollTo(0, 0);
}
$('steps').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); };
$('beat').addEventListener('click', e => { const b = e.target.closest('.badge[data-name]'); if (b && S) pick(b.dataset.name); });
$('prev').onclick = () => show(i - 1);
$('next').onclick = () => show(i + 1);
document.addEventListener('keydown', e => { if (!S || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(i + 1); } if (e.key === 'ArrowLeft') show(i - 1); });
function chrome(on) { $('pager').hidden = $('restart').hidden = $('replay').hidden = !on; $('skip').hidden = true; $('beat').classList.remove('wide'); if (!on) $('steps').innerHTML = ''; }

// ---- replay: the run told step by step, results landing as they were found ----
let run = 0;
const wait = ms => { const t = run; return new Promise((ok, stop) => setTimeout(() => t === run ? ok() : stop('stopped'), ms)); };
const clock = t0 => { const s = Math.round((performance.now() - t0) / 1000); return `${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
async function type(el, text, speed = 22) {
  el.classList.add('caret'); el.textContent = '';
  for (const ch of text) { el.textContent += ch; await wait(speed); }
  await wait(400); el.classList.remove('caret');
}
const signalsOf = () => {
  const seen = new Set(), out = [];
  for (const m of S.top) for (const r of m.reasons) if (r.factor === 'intent') {
    const [head, ...rest] = r.text.split(': '), topic = r.path[r.path.length - 1], key = m.company + topic;
    if (seen.has(key)) continue; seen.add(key);
    out.push({ m, topic, src: r.path.includes('POSTED') ? `${m.name}’s LinkedIn` : `${m.company} site`, text: rest.join(': ') || head });
  }
  return out;
};

async function play() {
  const t = ++run, t0 = performance.now(), M = S.memory, k = S.room.kinds, ops = k.operator || 0, out = S.room.companies - ops;
  const host = S.seller.url.replace(/^https?:\/\//, '').replace(/\/$/, ''), sigs = signalsOf();
  const STEPS = [
    ['Reading your website', `${S.seller.icp.segments.length} segments, ${S.seller.icp.buyer_roles.length} buyer titles`],
    ['Reading every company in the room', `${S.room.companies} companies, ${ops} could buy`],
    ['Finding buying signals', `${S.room.signals} signals in sites and posts`],
    ['Ranking the shortlist', `Top ${S.top.length}, led by ${S.top[0].name}`],
    ['Connecting the why', 'Every pick traced to its paths'],
    ['Adding who you know', `${M.target} moves to #${M.rank_after ?? '–'}`],
    ['Drafting the opener', `For ${S.email.to}, waiting for you`],
  ];
  chrome(true); $('pager').hidden = true; $('replay').hidden = true; $('skip').hidden = false; $('steps').innerHTML = '';
  const main = $('beat'); main.classList.add('wide'); window.scrollTo(0, 0);
  main.innerHTML = `<div class="scan">
    <aside class="rail"><small>Replay of the run</small><b class="title" id="rt">Reading the room</b>
      <ol class="checks">${STEPS.map(([l], n) => `<li data-s="${n}"><span class="c"></span><span>${l}</span></li>`).join('')}</ol>
      <div class="rail-foot"><div class="pbar"><i id="pf"></i></div><b id="ps">Step 1 of ${STEPS.length}</b><span>${esc(S.event)} for ${esc(S.seller.name)}</span></div></aside>
    <section class="stage"><span class="pill" id="pill"></span><h2 id="sh"></h2><div class="panel" id="panel"></div></section>
    <aside class="feed"><div class="feed-h"><i></i>Live activity</div><ol id="feed"></ol></aside></div>`;
  const panel = $('panel'), feed = (text, cls = '') => {
    $('feed').insertAdjacentHTML('afterbegin', `<li class="land ${cls}"><i></i><span>${text}</span><time>${clock(t0)}</time></li>`); };
  const step = async (n, headline) => {
    document.querySelectorAll('.checks li').forEach(li => { const s = +li.dataset.s; li.className = s < n ? 'done' : s === n ? 'now' : '';
      li.querySelector('.c').textContent = s < n ? '✓' : '';
      if (s < n && !li.querySelector('.sub')) li.insertAdjacentHTML('beforeend', `<span class="sub">${esc(STEPS[s][1])}</span>`); });
    $('pill').textContent = `Step ${n + 1} of ${STEPS.length}`; $('ps').textContent = `Step ${n + 1} of ${STEPS.length}`;
    $('pf').style.width = `${100 * n / STEPS.length}%`;
    panel.className = 'panel'; panel.innerHTML = '';
    await type($('sh'), headline);
  };
  try {
    // 1. your site
    panel.innerHTML = `<div class="site land">${logo(host, S.seller.name, 32)}${esc(host)}</div>`;
    feed(`Reading ${esc(host)}`);
    await step(0, `${S.seller.name} sells to ${S.seller.icp.segments.slice(0, 2).join(' and ')}`);
    panel.innerHTML = `<div class="site">${logo(host, S.seller.name, 32)}${esc(host)}</div><p class="lede land">${esc(S.seller.summary)}</p>
      <h4>Sells to</h4><div class="tags" id="g1"></div><h4>Buyer titles</h4><div class="tags" id="g2"></div><h4>Listens for</h4><div class="tags" id="g3"></div>`;
    for (const [id, xs, cls] of [['g1', S.seller.icp.segments, 'seg'], ['g2', S.seller.icp.buyer_roles, ''], ['g3', S.seller.icp.pain_topics, '']])
      for (const x of xs) { $(id).insertAdjacentHTML('beforeend', `<span class="tag land ${cls}">${esc(x)}</span>`); await wait(110); }
    feed(`Found ${S.seller.icp.segments.length} segments and ${S.seller.customers.length} customers to find twins of`);
    await wait(900);

    // 2. the room
    await step(1, `${out} of ${S.room.companies} companies are selling, not buying`);
    const picks = new Set(S.top.map(m => m.company));
    panel.classList.add('scroll');
    panel.innerHTML = `<div class="counter"><b id="cn">0</b><span>/ ${S.room.companies} companies read</span><em id="co">0 crossed off</em></div>
      <div class="names">${S.companies.map(c => `<span class="co ${picks.has(c.name) ? 'pick' : c.kind === 'operator' ? '' : 'out'}">${esc(c.name)}</span> `).join('')}</div>`;
    feed(`Opened the attendee list: ${S.room.people} people`);
    const cos = [...panel.querySelectorAll('.co')]; let crossed = 0;
    for (let n = 0; n < cos.length; n += 6) {
      cos.slice(n, n + 6).forEach(c => { c.classList.add('seen'); if (c.classList.contains('out')) crossed++; });
      $('cn').textContent = Math.min(n + 6, cos.length); $('co').textContent = `${crossed} crossed off`;
      const last = cos[Math.min(n + 5, cos.length - 1)]; panel.scrollTop = last.offsetTop - panel.clientHeight + 60;
      if (n === 60) feed(`${k.vendor || 0} vendors spotted so far, skipping them`);
      await wait(45);
    }
    feed(`${ops} companies could buy`);
    await wait(900);

    // 3. signals
    await step(2, `${S.room.signals} buying signals across the room`);
    const shown = sigs.slice(0, 6);
    panel.innerHTML = `<div class="signals">${shown.map(() => '<div class="skel" style="min-height:96px"></div>').join('')}</div>`;
    for (const [n, x] of shown.entries()) {
      await wait(420);
      panel.querySelector('.signals').children[n].outerHTML = `<div class="sig land"><div class="sig-h">${logo(x.m.domain, x.m.company, 22)}<b>${esc(x.m.company)}</b></div>
        <div class="meta"><span class="t">${esc(x.topic)}</span><span style="color:var(--ink3);font-size:13px">${esc(x.src)}</span></div><p>“${esc(x.text)}”</p></div>`;
      feed(`${esc(x.m.company)}: ${esc(x.topic)}`, 'f-sig');
    }
    await wait(1200);

    // 4. shortlist
    await step(3, `${S.top[0].name} at ${S.top[0].company} leads the list`);
    panel.classList.add('scroll');
    panel.innerHTML = `<div class="badges">${S.top.map(() => '<div class="skel" style="min-height:190px"></div>').join('')}</div>`;
    for (const [n, m] of S.top.entries()) {
      await wait(260);
      const slot = panel.querySelector('.badges').children[n];
      slot.outerHTML = badge(m, n + 1, n === 0).replace('class="badge"', 'class="badge land"');
      feed(`#${n + 1} ${esc(m.name)}, ${esc(m.company)}`);
    }
    await wait(1400);

    // 5. graph
    await step(4, 'Every pick traced to the paths that scored it');
    panel.innerHTML = '<div class="map" id="graph"></div>';
    const focus = mountGraph($('graph'), S.top);
    const svg = panel.querySelector('svg'), lines = [...svg.querySelectorAll('line')], nodes = [...svg.querySelectorAll('.n')];
    svg.querySelector('.n.you').classList.add('on');
    for (let n = 0; n < Math.max(lines.length, nodes.length); n += 2) {
      lines.slice(n, n + 2).forEach(l => l.classList.add('on')); nodes.slice(n, n + 2).forEach(x => x.classList.add('on'));
      await wait(55);
    }
    feed(`${nodes.length} nodes and ${lines.length} paths in FalkorDB`);
    await wait(500); focus(S.top[0].name); feed(`Why ${esc(S.top[0].name)}: ${new Set(S.top[0].reasons.map(r => r.text)).size} reasons`);
    await wait(1800);

    // 6. warm intro
    const contact = M.note.match(/^Met (\S+)/)?.[1] || 'a contact';
    await step(5, `One line about ${contact} moves ${M.target} to #${M.rank_after ?? '–'}`);
    const li = m => `<li data-n="${esc(m.name)}" class="${m.name === M.target ? 'hit' : ''}">${logo(m.domain, m.company, 18)}<b>${esc(m.name)}</b><small>${esc(m.company)}</small></li>`;
    const before = S.top.slice(0, M.rank_before);
    panel.innerHTML = `<div class="split" style="grid-template-columns:minmax(260px, 380px) 1fr"><div><div class="card-note"><span id="nt"></span><small>Typed to the agent</small></div>
      <div class="chain" id="ch" style="opacity:0"><span>You</span><i></i><span>${esc(contact)}</span><i></i><span>${esc(M.target)}</span></div></div>
      <div class="ladder" style="grid-template-columns:1fr"><ol id="ld">${before.map(li).join('')}</ol></div></div>`;
    await type($('nt'), M.note, 28);
    $('ch').style.opacity = 1; $('ch').classList.add('land');
    feed(`Saved: You know ${esc(contact)}, ${esc(contact)} knows ${esc(M.target)}`, 'f-warm');
    await wait(900);
    const ol = $('ld'), first = new Map([...ol.children].map(x => [x.dataset.n, x.getBoundingClientRect().top]));
    ol.innerHTML = M.top_after.slice(0, Math.max(M.rank_before, 5)).map(li).join('');
    for (const x of ol.children) { const was = first.get(x.dataset.n); if (was == null) { x.classList.add('land'); continue; }
      x.animate([{ transform: `translateY(${was - x.getBoundingClientRect().top}px)` }, { transform: 'none' }], { duration: 600, easing: 'cubic-bezier(0.77, 0, 0.175, 1)' }); }
    feed(`${esc(M.target)} moved #${M.rank_before} to #${M.rank_after ?? '–'}`, 'f-warm');
    await wait(2200);

    // 7. email
    await step(6, `An opener for ${S.email.to}, waiting for your OK`);
    panel.classList.add('scroll');
    panel.innerHTML = `<div class="mail" style="box-shadow:none;border:1px solid var(--rule)"><div class="f"><span>To</span><b>${esc(S.email.to)}</b></div><div class="f"><span>Subject</span><b>${esc(S.email.subject)}</b></div>
      <div class="body" id="eb"></div><div class="act" id="act" style="visibility:hidden"><button class="btn" id="approve">Approve and send</button><button class="btn ghost" id="deny">Don’t send</button><p>TrueForge holds send_email until you decide.</p></div></div>`;
    const eb = $('eb'), words = S.email.body.split(/(\s+)/);
    for (let n = 0; n < words.length; n += 3) { eb.textContent += words.slice(n, n + 3).join(''); await wait(28); }
    $('act').style.visibility = 'visible'; $('act').classList.add('land');
    $('approve').onclick = () => $('act').innerHTML = `<span class="done">Approved and sent to ${esc(S.email.to)}.</span>`;
    $('deny').onclick = () => $('act').innerHTML = `<span>Not sent. The draft stays with the agent.</span>`;
    feed(`Draft ready for ${esc(S.email.to)}, waiting for approval`);

    // done
    document.querySelectorAll('.checks li').forEach((li, s) => { li.className = 'done'; li.querySelector('.c').textContent = '✓';
      if (!li.querySelector('.sub')) li.insertAdjacentHTML('beforeend', `<span class="sub">${esc(STEPS[s][1])}</span>`); });
    $('pf').style.width = '100%'; $('ps').textContent = 'Done'; $('rt').textContent = 'Your shortlist is ready';
    $('skip').textContent = 'Explore the results';
  } catch (e) { if (e !== 'stopped') throw e; }
}

function showForm(err) {
  run++; S = null; picked = null; chrome(false);
  $('beat').innerHTML = `<div class="intake"><div>
    <h1>Know who to meet before you walk in.</h1>
    <p class="lede">Add your website and the event’s attendee list. You get a ranked shortlist, the reason behind each name, and a first email to approve.</p>
    <form id="f">
      <label>Your company website <input type="text" name="website" placeholder="yourcompany.com" required autocomplete="url"></label>
      <div class="either">
        <label for="sheet">Attendee list
          <span class="drop"><input type="file" name="sheet" accept=".xlsx,.csv" id="sheet"><b id="sheetname">Choose a file</b><span>.xlsx or .csv</span></span></label>
        <em>or</em>
        <label>Public Luma link <input type="text" name="event_url" placeholder="luma.com/your-event" inputmode="url"></label>
      </div>
      <label>Event name <small>Optional. We use the file or page name if empty.</small><input type="text" name="event_name" placeholder="e.g. SaaStr Annual"></label>
      <p class="err" id="err" role="alert">${esc(err || '')}</p>
      <div><button class="btn" type="submit">Find my shortlist</button></div>
    </form>
    <div class="stack">${SPONSORS.map(([d, n, what]) => `<span>${logo(d, n, 18)}<b>${n}</b> ${what}</span>`).join('')}</div></div>
    <div class="hero-badge" aria-hidden="true"><div class="lanyard"></div>${badge({ name:'Your next customer', title:'VP Sales, buying this quarter', company:'Somewhere in this room', score:11.5,
      reasons:[{factor:'fit',points:6},{factor:'intent',points:3.5},{factor:'warmth',points:2}] }, 1)}</div></div>
    <section class="section" aria-labelledby="how"><h2 id="how">How it works</h2><div class="how">
      <div><div class="who">${logo('brightdata.com', 'Bright Data', 22)}Bright Data</div><h3><span>1</span>Read</h3>
        <p>We read your site to learn who you sell to. Then every attendee’s company site, Google results and recent LinkedIn posts.</p></div>
      <div><div class="who">${logo('falkordb.com', 'FalkorDB', 22)}FalkorDB</div><h3><span>2</span>Connect</h3>
        <p>People, companies, buying signals and the people you already know go into one graph. Every score is a set of paths, so each pick shows its work.</p></div>
      <div><div class="who">${logo('truefoundry.com', 'TrueForge', 22)}${logo('openai.com', 'OpenAI', 22)}TrueForge on OpenAI</div><h3><span>3</span>Act</h3>
        <p>Ask the agent who to meet, why, or for an opener. Tell it who you know and the list re-ranks. It asks before it sends anything.</p></div>
    </div></section>
    <section class="section" id="sample" hidden></section>
    <footer><span>data-here, built at Patch the Conference, San Francisco</span><span>Attendee data stays on this machine</span><span>Names shown as first name and last initial</span></footer>`;
  sample();
  $('sheet').onchange = e => $('sheetname').textContent = e.target.files[0]?.name || 'Choose a file';
  $('f').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = '';
    const body = new FormData(e.target), url = (body.get('event_url') || '').trim();
    if (url && !/^https?:/.test(url)) body.set('event_url', 'https://' + url);
    const r = await fetch('/api/run', { method: 'POST', body });
    const d = await r.json();
    if (!r.ok) { $('err').textContent = d.error || 'The run could not start. Check the inputs and try again.'; return; }
    stage = 0; poll(d.id, d.event);
  };
}

// progress: a step is done once its first log line appears (pipeline.py prints these)
const STAGES = [['Reading your website', 'brightdata.com', 'Bright Data', /^seller:/],
                ['Sorting every company in the room', 'brightdata.com', 'Bright Data', /^\[\d+\/\d+\] .+: \w+/],
                ['Reading prospects’ LinkedIn posts', 'brightdata.com', 'Bright Data', /enriched/],
                ['Scoring and connecting the graph', 'falkordb.com', 'FalkorDB', /building the story/]];
let stage = 0;
async function poll(id, event) {
  const d = await (await fetch(`/api/jobs/${id}`)).json();
  if (d.status === 'error') return showForm(`The run stopped: ${d.error}`);
  if (d.status === 'done') { history.replaceState(null, '', `?story=${id}`); return load(id); }
  for (const line of d.log) STAGES.forEach((s, k) => { if (s[3].test(line)) stage = Math.max(stage, k + 1); });
  const open = document.querySelector('details')?.open ? ' open' : '';
  $('beat').innerHTML = `<h2>Reading the room at ${esc(event)}</h2>
    <p class="lede">An event we’ve read before replays in seconds. A new one runs live and takes a few minutes.</p>
    <ol class="progress">${STAGES.map(([what, d, n], k) => `<li class="${k < stage ? 'done' : k === stage ? 'now' : ''}"><span class="tick">${k < stage ? '✓' : ''}</span>${what}<span class="src">${logo(d, n, 16)}${n}</span></li>`).join('')}</ol>
    <details${open}><summary>Show the run log</summary><pre>${d.log.map(esc).join('\n') || 'starting'}</pre></details>`;
  setTimeout(() => poll(id, event), 1200);
}

const SAMPLE = 'fast-casual-summit';  // a finished run kept in data/story/ for the landing page
async function sample() {
  const r = await fetch(`/api/jobs/${SAMPLE}/story`);
  const el = $('sample');
  if (!r.ok || !el) return;
  const s = await r.json(), ops = s.room.kinds.operator || 0, picks = new Set(s.top.map(m => m.company));
  let p = 0;
  el.innerHTML = `<div class="sample"><div>
      <h2>Tried on ${esc(s.event)}</h2>
      <p class="lede">The full run for ${esc(s.seller.name)}, from the real attendee list.</p>
      <ul class="funnel"><li><b>${s.room.people}</b>people on the list</li><li><b>${s.room.companies}</b>companies read</li>
        <li><b>${ops}</b>could buy</li><li><b>${s.top.length}</b>on the shortlist, each with reasons</li></ul>
      <button class="btn" id="open-sample">Watch this run</button></div>
    <div class="sheet" aria-hidden="true"><div class="sheet-head">${esc(s.event)}: companies attending <span>${s.room.companies}</span></div>
      <div class="names">${(s.companies || []).filter((c, n) => picks.has(c.name) || n < 60).map((c, n) => picks.has(c.name) ? `<span class="co pick" style="--p:${p++}">${esc(c.name)}</span> `
        : `<span class="co ${c.kind === 'operator' ? '' : 'out'}" style="--k:${n}">${esc(c.name)}</span> `).join('')}</div></div></div>`;
  el.hidden = false;
  $('open-sample').onclick = () => { history.replaceState(null, '', `?story=${SAMPLE}`); load(SAMPLE); };
}

async function load(id) {
  const r = await fetch(`/api/jobs/${encodeURIComponent(id)}/story`);
  if (!r.ok) return showForm('That run has no results. Start a new one.');
  S = await r.json(); S.companies ||= []; S.top.forEach(m => m.domain ||= '');
  play();
}
$('skip').onclick = () => { $('skip').textContent = 'Skip to results'; show(0); };
$('replay').onclick = () => play();

$('restart').onclick = () => { history.replaceState(null, '', '/'); showForm(); };
const pre = new URLSearchParams(location.search).get('story');  // ?story=<run id> reopens a finished run
pre ? load(pre) : showForm();
</script>
